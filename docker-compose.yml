services:
  api:
    build: 
      context: ./backend
      dockerfile: ./docker/local/django/Dockerfile
    command: /start
    volumes:
      - ./backend:/django_app
      - static_volume:/usr/share/nginx/html/staticfiles
      - media_volume:/usr/share/nginx/html/mediafiles
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    depends_on:
      - monseen-db
      - redis
    networks:
      - monseen-network

  monseen-db:
    image: postgres:16.0
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi


  redis:
    image: redis:7.2.4
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi

  nginx-dev:
    restart: always
    depends_on:
      - api
    volumes:
      - static_volume:/usr/share/nginx/html/staticfiles
      - media_volume:/usr/share/nginx/html/mediafiles
      - ./client/dist:/usr/share/nginx/html
    build:
      context: ./backend/docker/local/nginx-dev
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi

  client-dev:
    build:
      context: ./client
      dockerfile: ./docker/local/Dockerfile
    command: npm run dev
    volumes:
      - ./client:/app
      - /app/node_modules
      - vite_cache:/app/node_modules/.vite
    ports:
      - "5173:5173"
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi

  nginx:
    restart: always
    depends_on:
      - api
    volumes:
      - static_volume:/usr/share/nginx/html/staticfiles
      - media_volume:/usr/share/nginx/html/mediafiles
      - ./client/dist:/usr/share/nginx/html
    build:
      context: ./backend/docker/local/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi

  celery_worker:
    build:
      context: ./backend
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-celeryworker
    volumes:
      - ./backend:/django_app
      - media_volume:/usr/share/nginx/html/mediafiles 
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - monseen-db
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi


  celery_beat:
    build:
      context: ./backend
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-celerybeat
    volumes:
      - ./backend:/django_app
      - media_volume:/usr/share/nginx/html/mediafiles 
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - monseen-db
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi

  flower:
    build:
      context: ./backend
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-flower
    volumes:
      - ./backend:/django_app
      - media_volume:/usr/share/nginx/html/mediafiles
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5558:5558"
    depends_on:
      - redis
      - monseen-db
      - celery_worker
    networks:
      - monseen-network
    environment:
      - TZ=Africa/Nairobi
      - FLOWER_BASIC_AUTH=admin:admin1234

networks:
  monseen-network:
     driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
  vite_cache:
